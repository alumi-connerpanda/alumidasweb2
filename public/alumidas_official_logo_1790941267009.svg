    <text x="110" y="96" font-family="'Oswald', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="96" letter-spacing="12" fill="#FFFFFF" text-anchor="middle">ALU</text>

    <!-- MIDAS Text in Golden Yellow -->
